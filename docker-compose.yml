services:
  web:
    build: .
    command: gunicorn pusto.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/app/pusto/staticfiles
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  static_volume: