{% extends 'pusto/head.html' %}
{% load static %}
{% load i18n %}

{% block emailVerified %}

<title>{% trans "електронну пошту підтверджено" %}</title>

<style>
.verify-page {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.verify-box {
    width: 100%;
    max-width: 420px;
    border: 1px solid #d9dee5;
    border-radius: 12px;
    padding: 32px 24px;
    text-align: center;
}

.verify-box h1 {
    margin: 0 0 16px;
    font-size: 28px;
    line-height: 1.3;
    color: #1f2937;
}

.verify-box p {
    margin: 0 0 24px;
    font-size: 16px;
    line-height: 1.5;
    color: #4b5563;
}

.verify-btn {
    display: inline-block;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 500;
    color: #ffffff;
    background: #202B6C;
    border: 1px solid #2563eb;
    border-radius: 8px;
    text-decoration: none;
    transition: background 0.2s ease, border-color 0.2s ease;
}
</style>

<div class="verify-page">
    <div class="verify-box">
        <h1>{{ msg }}</h1>
        <a href="{% url 'login' %}" class="verify-btn">
            {% trans "перейти на сторінку входу" %}
        </a>
    </div>
</div>

{% endblock %}
